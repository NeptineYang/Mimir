# 构建内存与编码。不要在此写机器相关绝对路径：
# JDK 由 scripts/env.ps1 注入 JAVA_HOME，Gradle 用户目录由 GRADLE_USER_HOME 指定。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 兼容开关：KSP 2.2.10-2.0.2 仍通过 kotlin.sourceSets 注册 build/generated/ksp 生成目录，
# AGP 9 内置 Kotlin 默认拒绝这一写法（报错原文建议设此值为 false）。
# 仅放行生成目录注册，不影响 Kotlin 编译由 AGP 内置承担。待 KSP 适配内置 Kotlin 后删除。
android.disallowKotlinSourceSets=false

kotlin.code.style=official
