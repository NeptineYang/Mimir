name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Download speech recognition assets
        run: python3 scripts/fetch-asr-assets.py

      - name: Prepare release signing
        env:
          MIMIR_KEYSTORE_BASE64: ${{ secrets.MIMIR_KEYSTORE_BASE64 }}
          MIMIR_STORE_PASSWORD: ${{ secrets.MIMIR_STORE_PASSWORD }}
          MIMIR_KEY_ALIAS: ${{ secrets.MIMIR_KEY_ALIAS }}
          MIMIR_KEY_PASSWORD: ${{ secrets.MIMIR_KEY_PASSWORD }}
        run: |
          printf '%s' "$MIMIR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mimir-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/mimir-release.jks"
            printf 'storePassword=%s\n' "$MIMIR_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$MIMIR_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$MIMIR_KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and name artifact
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/mimir-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.apk --generate-notes
          fi
